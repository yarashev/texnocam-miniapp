<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UzCam — Ustalar boshqaruvi</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#14213d;font:14px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:16px}header,.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}header{justify-content:space-between}h1{font-size:23px;margin:0}h2{font-size:18px}button,input,select{font:inherit}button,.link{border:1px solid #dce4ef;border-radius:10px;min-height:42px;padding:9px 12px;background:white;color:#14213d;cursor:pointer}button.primary{background:#059669;color:white;border:0}button.danger{color:#b42318}input,select{padding:10px;border:1px solid #dce4ef;border-radius:9px;background:white;min-width:0;width:100%}.toolbar{margin:16px 0}.toolbar input{flex:1 1 220px}.toolbar select{flex:0 1 200px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}article,.summary{background:white;border:1px solid #e3eaf4;border-radius:15px;padding:16px}.summary{margin:16px 0;color:#047857}article p{margin:7px 0;overflow-wrap:anywhere}.muted,small{color:#64748b}.actions{margin-top:12px}.badge{color:#047857;background:#ecfdf5;border-radius:9px;padding:4px 8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:4px}.wide{grid-column:1/-1}dialog{border:1px solid #dce4ef;border-radius:17px;width:min(95vw,620px);max-height:90vh;overflow:auto;padding:20px}dialog::backdrop{background:#14213d80}.dialog-head{display:flex;justify-content:space-between;align-items:center}.rate-row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin:10px 0}#notice,.error{color:#a52e3a}a{color:#047857}button:disabled{opacity:.5}@media(max-width:480px){.form{grid-template-columns:1fr}.rate-row{grid-template-columns:1fr}.wide{grid-column:1}}
</style><main><header><div><small>UzCam · Bosh usta</small><h1>Ustalar boshqaruvi</h1></div><a class="link" href="/">Mini App</a></header><p id="notice" role="status">Ruxsat tekshirilmoqda…</p><section id="workspace" hidden><div class="summary" id="summary"></div><div class="toolbar"><input id="search" placeholder="Ism, Telegram ID yoki hudud…" aria-label="Ustani qidirish"><select id="filter" aria-label="Usta holati"><option value="all">Barcha ustalar</option><option value="available">Bo‘sh</option><option value="busy">Vaqtincha band</option><option value="inactive">Faol emas</option></select><button id="refresh">Yangilash</button><button id="add" class="primary">＋ Usta qo‘shish</button></div><div id="workers" class="cards"></div></section></main>
<dialog id="editor"><div class="dialog-head"><h2>Usta ma’lumotlari</h2><button type="button" data-close="editor" aria-label="Yopish">×</button></div><form id="workerForm" class="form"><label>Telegram ID<input name="telegramId" inputmode="numeric" pattern="[0-9]{5,20}" required></label><label>Ism-familiya<input name="fullName" maxlength="100" required></label><label>Telefon 1 (ixtiyoriy)<input name="phone1" type="tel"></label><label>Telefon 2 (ixtiyoriy)<input name="phone2" type="tel"></label><label>Telefon 3 (ixtiyoriy)<input name="phone3" type="tel"></label><label>Telegram username<input name="telegramUsername" maxlength="32"></label><label>Ish staji (yil)<input name="experienceYears" type="number" min="0" max="60" value="0"></label><label>Viloyat<input name="serviceRegion" maxlength="80"></label><label>Shahar<input name="serviceCity" maxlength="80"></label><label>Tuman<input name="serviceDistrict" maxlength="80"></label><label class="wide"><span><input name="isPublic" type="checkbox" style="width:auto"> Ustalar katalogida ko‘rsatish</span></label><p class="error wide" id="workerError"></p><button class="primary wide" type="submit">Saqlash</button></form></dialog>
<dialog id="prices"><div class="dialog-head"><h2 id="pricesTitle">Xizmatlar va narxlar</h2><button type="button" data-close="prices" aria-label="Yopish">×</button></div><p class="muted">Xizmat nomlari umumiy. Faqat narxni kiriting. Narxni bo‘sh qoldirsangiz, bu xizmat ustada ko‘rsatilmaydi.</p><form id="priceForm"><div id="rateFields"></div><p class="error" id="priceError"></p><button class="primary" type="submit">Narxlarni saqlash</button></form></dialog>
<dialog id="jobs"><div class="dialog-head"><h2>Ustaning oxirgi ishlari</h2><button type="button" data-close="jobs" aria-label="Yopish">×</button></div><div id="jobList"></div></dialog>
<script src="head-worker.js?v=20261116-1"></script></html>
