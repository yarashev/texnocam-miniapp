<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UzCam — Usta kabineti</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>body{margin:0;background:#f5f7fb;color:#14213d;font:15px/1.5 system-ui}main{max-width:720px;margin:auto;padding:18px 14px 60px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:21px}article{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:12px 0}button,a{min-height:44px;border:0;border-radius:10px;padding:10px 14px;font:inherit}button{background:#059669;color:white;cursor:pointer}button:disabled{opacity:.5}a{color:#047857}p{overflow-wrap:anywhere}small{color:#6b7280}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{color:#047857;font-weight:700}#notice{color:#a52e3a}nav{display:flex;gap:10px}</style><main><header><h1>Usta kabineti</h1><a href="/">Bosh sahifa</a></header><nav><button id="refresh">Yangilash</button><button id="history">Tarix</button></nav><p id="notice" role="status"></p><section id="jobs">Yuklanmoqda…</section></main><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();let history=false,busy=false;
const labels={accepted:'Qabul qilindi',travelling:'Yo‘lga chiqdi',working:'Bajarilmoqda',awaiting_customer:'Mijoz tasdig‘i kutilmoqda',disputed:'Dispetcher ko‘rib chiqmoqda',completed:'Yakunlandi'};
const node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
async function request(url,data){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',...data})});const result=await response.json();if(!response.ok)throw Error(result.error||'Xatolik');return result}
async function load(){if(busy)return;try{if(!tg?.initData)throw Error('Kabinetni Telegram Mini App ichidan oching.');const result=await request('/api/service/jobs',{});const host=document.querySelector('#jobs');host.replaceChildren();const jobs=result.jobs.filter(j=>history?j.service_state==='completed':j.service_state!=='completed');if(!jobs.length)host.append(node('p',history?'Yakunlangan ishlar yo‘q.':'Faol ishlar yo‘q. Yangi takliflar Telegram bot orqali keladi.'));for(const job of jobs){const card=node('article','');card.append(node('h2',job.order_number),node('p',labels[job.service_state]||job.service_state));const customer=result.role==='customer';card.append(node('p',customer?'Usta: '+job.worker_name:'Mijoz: '+job.customer_name));if(!customer){card.append(node('p','Manzil: '+job.delivery_address));if(job.delivery_phone){const a=node('a','☎ '+job.delivery_phone);a.href='tel:'+String(job.delivery_phone).replace(/[^+0-9]/g,'');card.append(a)}if(/^[a-zA-Z0-9_]{5,32}$/.test(job.customer_username||'')){const a=node('a','Telegram');a.href='https://t.me/'+job.customer_username;a.target='_blank';a.rel='noopener';card.append(a)}}const actions=node('div','');actions.className='actions';const add=(label,action,rating)=>{const b=node('button',label);b.onclick=async()=>{if(busy)return;busy=true;b.disabled=true;try{await request('/api/service/jobs/'+job.id+'/action',{action,rating});document.querySelector('#notice').textContent='Saqlandi';}catch(e){document.querySelector('#notice').textContent=e.message}finally{busy=false;await load()}};actions.append(b)};if(result.role==='worker'){if(job.service_state==='accepted')add('Yo‘lga chiqdim','travelling');if(['accepted','travelling'].includes(job.service_state))add('Ishni boshladim','working');if(job.service_state==='working')add('Ishni yakunladim','finish');if(job.service_state==='accepted')card.append(node('small','Qabul qilishdan keyin 10 daqiqa davomida Telegramdagi bekor qilish tugmasi ishlaydi. Shundan keyin ishni boshlash mumkin.'));}if(customer&&job.service_state==='awaiting_customer'){for(let n=1;n<=5;n++)add((job.selected_rating===n?'✅ ':'')+n+' ⭐','star',n);add('Tasdiqlash va baholash','confirm');const problem=node('button','Muammo bor');problem.onclick=()=>{problem.remove();add('Dispetcherga xabar berish','dispatch')};actions.append(problem)}if(job.rating)card.append(node('p','Baho: '+job.rating+' ⭐'));card.append(actions);host.append(card)}}catch(e){document.querySelector('#jobs').replaceChildren();document.querySelector('#notice').textContent=e.message}}
document.querySelector('#refresh').onclick=load;document.querySelector('#history').onclick=()=>{history=!history;document.querySelector('#history').textContent=history?'Faol ishlar':'Tarix';load()};load();setInterval(load,15000);
</script></html>
